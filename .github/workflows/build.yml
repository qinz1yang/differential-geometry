name: Lean Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    name: Audit Project
    runs-on: 
      - self-hosted
      - macOS
      - ARM64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install elan and Lean 4.29
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain leanprover/lean4:v4.29.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Run the single audit command
        run: |
          lake exe cache get
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          bash Scripts/audit.sh "$BASE_REF"
