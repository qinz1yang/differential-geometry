name: Lean Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    name: Audit Project
    runs-on: 
      - self-hosted
      - macOS
      - ARM64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: Install elan and project Lean toolchain
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Fetch pinned dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if lake env true; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
      - name: Build project from source
        run: lake --no-cache build DifferentialGeometry
