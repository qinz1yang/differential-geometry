name: Lean Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    name: Audit Project
    runs-on: 
      - self-hosted
      - macOS
      - ARM64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: Install elan and Lean 4.33.1
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build project from source
        run: lake --no-cache build DifferentialGeometry
