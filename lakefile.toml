name = "DifferentialGeometry"
version = "0.1.2"
keywords = ["math"]
defaultTargets = ["DifferentialGeometry"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
linter.style.header = false
linter.style.longLine = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "DifferentialGeometry"
