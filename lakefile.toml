name = "DifferentialGeometry"
version = "1.2.1"
keywords = ["math"]
defaultTargets = ["DifferentialGeometry"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
autoImplicit = false
linter.style.longLine = false
linter.unusedSectionVars = false
linter.style.emptyLine = false
linter.style.whitespace = false
linter.style.maxHeartbeats = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "DifferentialGeometry"
